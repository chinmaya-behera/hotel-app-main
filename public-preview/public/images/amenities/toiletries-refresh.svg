<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f8f6f2"/>
  <!-- left bottle -->
  <rect x="35" y="70" width="36" height="90" rx="8" fill="#d4c5a9"/>
  <rect x="43" y="60" width="20" height="14" rx="4" fill="#c4b08a"/>
  <rect x="50" y="50" width="6" height="14" rx="3" fill="#a89070"/>
  <rect x="35" y="100" width="36" height="4" rx="2" fill="#c4b08a" opacity="0.6"/>
  <text x="53" y="130" text-anchor="middle" font-size="7" fill="#7a6a52" font-family="Georgia,serif">SHAMPOO</text>
  <!-- right bottle -->
  <rect x="82" y="80" width="32" height="80" rx="8" fill="#e8ddd0"/>
  <rect x="89" y="71" width="18" height="12" rx="4" fill="#d4c5a9"/>
  <rect x="95" y="62" width="6" height="12" rx="3" fill="#c4b08a"/>
  <rect x="82" y="108" width="32" height="3" rx="1.5" fill="#c4b08a" opacity="0.5"/>
  <text x="98" y="135" text-anchor="middle" font-size="6" fill="#7a6a52" font-family="Georgia,serif">CONDITIONER</text>
  <!-- soap bar -->
  <rect x="128" y="130" width="46" height="26" rx="8" fill="#f0e8d8"/>
  <rect x="130" y="132" width="42" height="22" rx="6" fill="#f7f0e6" stroke="#e0d0b8" stroke-width="1"/>
  <ellipse cx="151" cy="143" rx="12" ry="5" fill="none" stroke="#c4b08a" stroke-width="1"/>
  <text x="151" y="147" text-anchor="middle" font-size="6" fill="#a89070" font-family="Georgia,serif">SOAP</text>
  <!-- decorative dots -->
  <circle cx="160" cy="60" r="3" fill="#d4c5a9" opacity="0.5"/>
  <circle cx="170" cy="50" r="2" fill="#d4c5a9" opacity="0.4"/>
  <circle cx="25" cy="140" r="2.5" fill="#d4c5a9" opacity="0.4"/>
</svg>