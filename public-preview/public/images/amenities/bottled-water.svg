<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#eef4f8"/>
  <!-- shadow -->
  <ellipse cx="100" cy="178" rx="60" ry="7" fill="#b0c4d4" opacity="0.35"/>
  <!-- left bottle (tilted slightly) -->
  <g transform="rotate(-5 80 120)">
    <rect x="62" y="60" width="34" height="112" rx="12" fill="white" stroke="#b8d4e8" stroke-width="1.5" fill-opacity="0.85"/>
    <!-- water fill -->
    <rect x="63" y="90" width="32" height="80" rx="10" fill="#c8e8f8" opacity="0.5"/>
    <!-- label -->
    <rect x="65" y="110" width="28" height="36" rx="4" fill="white" stroke="#a8c8e0" stroke-width="0.8"/>
    <text x="79" y="123" text-anchor="middle" font-size="5" fill="#5090b0" font-family="Georgia,serif" font-weight="bold">MINERAL</text>
    <text x="79" y="131" text-anchor="middle" font-size="5" fill="#5090b0" font-family="Georgia,serif">WATER</text>
    <line x1="68" y1="135" x2="90" y2="135" stroke="#a8c8e0" stroke-width="0.5"/>
    <text x="79" y="141" text-anchor="middle" font-size="4" fill="#78a8c0" font-family="Arial,sans-serif">500 ml</text>
    <!-- neck -->
    <rect x="72" y="46" width="14" height="18" rx="5" fill="#d0e8f4" stroke="#b8d4e8" stroke-width="1.2"/>
    <!-- cap -->
    <rect x="71" y="38" width="16" height="12" rx="5" fill="#4a90b0"/>
  </g>
  <!-- right bottle (upright) -->
  <g transform="rotate(3 126 115)">
    <rect x="108" y="55" width="36" height="118" rx="12" fill="white" stroke="#b8d4e8" stroke-width="1.5" fill-opacity="0.9"/>
    <!-- water fill -->
    <rect x="109" y="88" width="34" height="83" rx="10" fill="#c8e8f8" opacity="0.45"/>
    <!-- label -->
    <rect x="112" y="108" width="28" height="38" rx="4" fill="white" stroke="#a8c8e0" stroke-width="0.8"/>
    <text x="126" y="122" text-anchor="middle" font-size="5" fill="#5090b0" font-family="Georgia,serif" font-weight="bold">MINERAL</text>
    <text x="126" y="130" text-anchor="middle" font-size="5" fill="#5090b0" font-family="Georgia,serif">WATER</text>
    <line x1="115" y1="134" x2="137" y2="134" stroke="#a8c8e0" stroke-width="0.5"/>
    <text x="126" y="140" text-anchor="middle" font-size="4" fill="#78a8c0" font-family="Arial,sans-serif">750 ml</text>
    <!-- neck -->
    <rect x="118" y="40" width="16" height="20" rx="5" fill="#d0e8f4" stroke="#b8d4e8" stroke-width="1.2"/>
    <!-- cap -->
    <rect x="117" y="32" width="18" height="12" rx="5" fill="#4a90b0"/>
  </g>
</svg>