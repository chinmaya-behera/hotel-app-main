<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f5f5f0"/>
  <!-- shadow -->
  <ellipse cx="100" cy="176" rx="74" ry="7" fill="#c8c4bc" opacity="0.35"/>
  <!-- grey throw blanket (bottom) -->
  <rect x="18" y="128" width="164" height="46" rx="10" fill="#9fa8a3"/>
  <rect x="18" y="128" width="164" height="18" rx="10" fill="#b0bab5"/>
  <!-- throw texture lines -->
  <line x1="30" y1="136" x2="170" y2="136" stroke="#8a9490" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="143" x2="170" y2="143" stroke="#8a9490" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="150" x2="170" y2="150" stroke="#8a9490" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="157" x2="170" y2="157" stroke="#8a9490" stroke-width="0.8" opacity="0.5"/>
  <!-- white duvet (top) -->
  <rect x="25" y="60" width="150" height="76" rx="14" fill="white" stroke="#e0e0d8" stroke-width="1.5"/>
  <rect x="25" y="60" width="150" height="24" rx="14" fill="#f2f2ee"/>
  <!-- duvet fold line -->
  <rect x="25" y="81" width="150" height="4" rx="2" fill="#e0e0d8"/>
  <!-- duvet texture pattern -->
  <circle cx="60" cy="105" r="12" fill="none" stroke="#e8e8e4" stroke-width="1"/>
  <circle cx="100" cy="105" r="12" fill="none" stroke="#e8e8e4" stroke-width="1"/>
  <circle cx="140" cy="105" r="12" fill="none" stroke="#e8e8e4" stroke-width="1"/>
  <circle cx="80" cy="123" r="12" fill="none" stroke="#e8e8e4" stroke-width="1"/>
  <circle cx="120" cy="123" r="12" fill="none" stroke="#e8e8e4" stroke-width="1"/>
  <!-- piping -->
  <rect x="25" y="128" width="150" height="5" rx="2.5" fill="#e0e0d8"/>
</svg>